<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register Admin - Laporan Keuangan</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0b66ff;
      --primary-strong: #084ec4;
      --primary-soft: #edf5ff;
      --text: #0f172a;
      --text-soft: #64748b;
      --white: #ffffff;
      --line: #dfeafc;
      --bg: #f4f8ff;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow: 0 24px 54px rgba(10, 30, 79, 0.12);
    }

    * { box-sizing: border-box; font-family: Inter, Segoe UI, Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #edf5ff 0%, #f8fbff 35%, #ffffff 100%);
      color: var(--text);
      padding: 24px;
    }

    .auth-card {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 28px 28px 22px;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, rgba(11,102,255,0.08), rgba(11,102,255,0));
      pointer-events: none;
    }

    .brand, .auth-form, .status, .link-row {
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0b66ff, #6ea8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-weight: 800;
      box-shadow: 0 14px 28px rgba(11, 102, 255, 0.22);
      letter-spacing: -0.05em;
    }

    .brand-name {
      font-weight: 800;
      font-size: 1.08rem;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-soft);
      margin-top: 2px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 3vw, 2.2rem);
      letter-spacing: -0.05em;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--text-soft);
      position: relative;
      z-index: 1;
    }

    .auth-form {
      display: grid;
      gap: 16px;
      margin-top: 12px;
    }

    input, button {
      font: inherit;
    }

    .field-wrap {
      position: relative;
    }

    .field-wrap input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f9fbff;
      padding: 14px 16px;
      color: var(--text);
      font-size: 0.97rem;
      transition: all 0.2s ease;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.02);
    }

    .field-wrap input:focus {
      outline: none;
      border-color: rgba(11, 102, 255, 0.7);
      box-shadow: 0 0 0 4px rgba(11, 102, 255, 0.12);
      background: #ffffff;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: var(--white);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 14px 26px rgba(11, 102, 255, 0.18);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 28px rgba(11, 102, 255, 0.22);
    }

    .status {
      display: none;
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .status.error {
      display: block;
      background: rgba(220, 38, 38, 0.08);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.14);
    }

    .status.success {
      display: block;
      background: rgba(22, 163, 74, 0.08);
      color: var(--success);
      border: 1px solid rgba(22, 163, 74, 0.14);
    }

    .link-row {
      margin-top: 18px;
      font-size: 14px;
      color: var(--text-soft);
      text-align: center;
    }

    .link-row a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    .link-row a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div class="logo">FK</div>
      <div>
        <div class="brand-name">LaporanKeu</div>
        <div class="brand-sub">Register admin</div>
      </div>
    </div>

    <h2>Buat Akun Admin</h2>
    <p class="subtitle">Daftarkan akun admin baru untuk mengelola laporan.</p>

    <div class="auth-form">
      <div class="field-wrap">
        <input id="email" type="email" placeholder="Email admin" />
      </div>
      <div class="field-wrap">
        <input id="password" type="password" placeholder="Password" />
      </div>
      <button id="registerBtn" type="button">Daftar</button>
    </div>

    <div id="registerStatus" class="status"></div>

    <div class="link-row">
      Sudah punya akun? <a href="login.html">Login di sini</a>
    </div>
  </div>

  <script>
    const registerBtn = document.getElementById('registerBtn');
    const registerStatus = document.getElementById('registerStatus');

    function showStatus(message, type) {
      registerStatus.textContent = message;
      registerStatus.className = `status ${type}`;
    }

    registerBtn.addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showStatus('Email dan password wajib diisi.', 'error');
        return;
      }

      if (password.length < 6) {
        showStatus('Password minimal 6 karakter.', 'error');
        return;
      }

      showStatus('Pendaftaran berhasil. Silakan lanjutkan ke halaman login.', 'success');
    });
  </script>
</body>
</html>
